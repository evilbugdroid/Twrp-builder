name: Build TWRP for A01 Core

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Recovery
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git repo wget curl

      - name: Sync TWRP Source
        run: |
          mkdir ~/bin
          PATH=~/bin:$PATH
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          mkdir workspace
          cd workspace
          repo init -u https://github.com/TeamWin/android_manifest_twrp_omni.git -b twrp-12.1
          repo sync -j$(nproc --all) --force-sync

      - name: Clone Device Tree
        run: |
          cd workspace
          git clone https://github.com/almondnguyen/twrp_device_samsung_a01core device/samsung/a01core

      - name: Build Recovery Image
        run: |
          cd workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_a01core-eng
          make recoveryimage -j$(nproc --all)

      - name: Upload Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: recovery-a01core
          path: workspace/out/target/product/a01core/recovery.img
